{% extends 'base_catalogo.html' %}

{% block titolo %}Aggiungi Prodotto{% endblock %}

{% block contenuto %}
<h1>Inserisci un nuovo prodotto nel catalogo 📦</h1>

{% if errore %}
<div class="errore">⚠️ Errore: {{ errore }}</div>
{% endif %}

<form method="POST" action="/nuovo">
    <label for="nome">Nome Prodotto:</label>
    <input type="text" id="nome" name="nome_prodotto" placeholder="Esempio: Mouse Wireless">

    <label for="prezzo">Prezzo (€):</label>
    <input type="number" id="prezzo" name="prezzo_prodotto" step="0.01" placeholder="Esempio: 29.99">

    <button type="submit">Salva nel Catalogo</button>
</form>
{% endblock %}
